# Render Blueprint. API와 AI 서비스를 올린다(웹은 Netlify, DB는 Supabase). 2026-11-21 AI 서비스를 Vercel에서 옮겼다.
# 값이 sync:false인 항목은 대시보드에서 직접 넣는다. 비밀은 저장소에 두지 않는다.
services:
  - type: web
    name: lexwatch-api
    runtime: docker
    plan: free
    region: singapore      # Supabase(ap-southeast-1)와 Vercel ai(sin1)에 맞춘다
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false      # 배포는 CI(ci.yml deploy-api)가 테스트 통과 뒤에 한다
    envVars:
      - key: DATABASE_URL        # Supabase 세션 풀러 URI (docs/deploy.md 참고)
        sync: false
      - key: AI_BASE_URL         # Vercel ai 프로젝트 주소
        sync: false
      - key: JOB_TOKEN
        sync: false
      - key: AI_TOKEN            # Vercel ai 프로젝트의 AI_TOKEN과 같은 값. AI 호출에 X-Ai-Token으로 붙는다
        sync: false
      # LAW_OC는 블루프린트에 두지 않는다. sync:false 항목은 값이 비면 승인이 거부되는데,
      # 키가 없을 때는 비워 두는 것이 정답이다. 키를 받으면 대시보드나
      # `render services update <id> --env-var LAW_OC=...`로 넣는다.
      # ASSEMBLY_API_KEY(법안 레이더)도 같은 이유로 블루프린트에 두지 않는다. 없으면 법률마다 5건만 받는다.
      - key: Web__Origins        # Vercel web 프로젝트 주소(쉼표로 여러 개)
        sync: false
      - key: MIGRATE_ON_STARTUP
        value: "true"
      - key: DEMO_SEED_ON_STARTUP
        value: "true"
      - key: TRUST_FORWARDED_FOR # Render의 X-Forwarded-For를 확인하기 전에는 켜지 않는다
        value: "false"
      # CLIENT_IP_HEADER(예: True-Client-IP, CF-Connecting-IP)는 Render가 실제로 넘기는 헤더를
      # 확인한 뒤 대시보드에서 넣는다. 비어 있으면 TRUST_FORWARDED_FOR/원격 IP를 쓴다(docs/deploy.md).
  - type: web
    name: lexwatch-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./ai/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false      # 배포는 CI(ci.yml deploy-render)가 테스트 통과 뒤에 한다
    envVars:
      - key: AI_REQUIRE_TOKEN    # 토큰이 비면 503으로 닫는다
        value: "true"
      - key: AI_TOKEN            # API의 AI_TOKEN과 같은 값
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        value: 96dc7e6d07c8cb414af597acfec30146
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: auto
