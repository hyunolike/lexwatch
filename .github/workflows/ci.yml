name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      # Testcontainers가 ubuntu 러너의 Docker를 그대로 쓴다.
      - run: dotnet test backend/LexWatch.sln --nologo

  ai:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -q

  openapi-drift:
    # ai/openapi.json과 C# 클라이언트(AiClient.g.cs)가 FastAPI 앱과 어긋나면 실패한다.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
        working-directory: ai
      - run: ./scripts/gen-ai-client.sh
      - name: 재생성 결과가 커밋과 같은지 확인
        run: git diff --exit-code -- ai/openapi.json backend/src/LexWatch.Api/Ai/AiClient.g.cs

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next typegen   # PageProps/LayoutProps 전역 타입은 .next/types에 생성된다
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t lexwatch-api:ci .
      - run: docker build -f ai/Dockerfile -t lexwatch-ai:ci .
      - run: docker build -f web/Dockerfile -t lexwatch-web:ci .

  deploy-vercel:
    # main에 push되고 다섯 검사가 모두 통과했을 때만 Vercel(web, ai) 프로덕션을 배포한다.
    # vercel.json의 git.deploymentEnabled.main=false로 Git 연동의 프로덕션 자동 배포는 꺼져 있다. PR 미리보기는 그대로.
    needs: [backend, ai, openapi-drift, web, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            project_id: prj_v2DhruJFOamdPmxiQZWSvJA8yTo5
            token_secret: VERCEL_TOKEN_WEB
            check_url: https://lexwatch-web.vercel.app/
          - name: ai
            project_id: prj_ZhL9slWEJ7pobFh283gtAJGJGC2F
            token_secret: VERCEL_TOKEN_AI
            check_url: https://lexwatch-ai.vercel.app/health
    concurrency:
      group: deploy-vercel-${{ matrix.name }}
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: team_JLPkhn7nreUDgCKarZrAD9ZP
      VERCEL_PROJECT_ID: ${{ matrix.project_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vercel 프로덕션 배포 (${{ matrix.name }})
        env:
          # 프로젝트 하나로 범위를 제한한 토큰을 프로젝트마다 따로 둔다(대시보드 Tokens에서 Scope를 프로젝트로).
          VERCEL_TOKEN: ${{ secrets[matrix.token_secret] }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::${{ matrix.token_secret }} 시크릿이 없다. docs/deploy.md '자동 배포' 절을 보고 넣는다."
            exit 1
          fi
          npm install --global --no-fund --no-audit vercel@59.11.2
          # 저장소 루트에서 배포하면 프로젝트의 Root Directory(web, ai) 설정을 따른다.
          vercel deploy --prod --yes --token "$VERCEL_TOKEN" > deploy-url.txt
          echo "배포: $(cat deploy-url.txt)"
      - name: 공개 주소 확인 (${{ matrix.name }})
        run: |
          for i in $(seq 1 10); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 "${{ matrix.check_url }}" || true)
            if [ "$code" = "200" ]; then echo "ok: ${{ matrix.check_url }}"; exit 0; fi
            echo "대기 ${i}/10 (HTTP ${code})"
            sleep 10
          done
          echo "::error::${{ matrix.check_url }}가 200을 돌려주지 않는다."
          exit 1

  deploy-api:
    # main에 push되고 위 다섯 잡이 모두 통과했을 때만 Render API를 배포한다.
    # Vercel(web, ai)은 Git 연동으로 따로 배포된다. 절차와 시크릿: docs/deploy.md "자동 배포"
    needs: [backend, ai, openapi-drift, web, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    env:
      RENDER_SERVICE_ID: srv-dbt9gtgae00c73a31iag
      RENDER_CLI_VERSION: 2.36.0
      RENDER_CLI_SHA256: 97c83ceae5e99c8bc2d342a71c18c0af39841bc8af3429d01ca9a629aca66d0e
    steps:
      - name: Render CLI 설치 (버전과 체크섬 고정)
        run: |
          curl --silent --show-error --fail --location -o render.zip \
            "https://github.com/render-oss/cli/releases/download/v${RENDER_CLI_VERSION}/cli_${RENDER_CLI_VERSION}_linux_amd64.zip"
          echo "${RENDER_CLI_SHA256}  render.zip" | sha256sum --check -
          unzip -q render.zip "cli_v${RENDER_CLI_VERSION}" -d "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/cli_v${RENDER_CLI_VERSION}" /usr/local/bin/render
          render --version
      - name: 이 커밋을 배포하고 끝날 때까지 기다림
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::error::RENDER_API_KEY 시크릿이 없다. docs/deploy.md '자동 배포' 절을 보고 넣는다."
            exit 1
          fi
          # --wait: 배포가 실패하면 0이 아닌 값으로 끝난다.
          render deploys create "$RENDER_SERVICE_ID" --commit "$GITHUB_SHA" --wait --confirm -o text
      - name: 공개 주소에서 새 커밋 확인
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          for i in $(seq 1 20); do
            got=$(curl --silent --max-time 30 "${API_BASE_URL}/health" | jq -r '.commit // empty' 2>/dev/null || true)
            if [ "$got" = "$GITHUB_SHA" ]; then echo "live: $got"; exit 0; fi
            echo "대기 ${i}/20 (현재 ${got:-응답 없음})"
            sleep 15
          done
          echo "::error::배포는 끝났는데 /health가 ${GITHUB_SHA}를 돌려주지 않는다."
          exit 1
