name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      # Testcontainers가 ubuntu 러너의 Docker를 그대로 쓴다.
      - run: dotnet test backend/LexWatch.sln --nologo

  ai:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -q

  openapi-drift:
    # ai/openapi.json과 C# 클라이언트(AiClient.g.cs)가 FastAPI 앱과 어긋나면 실패한다.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
        working-directory: ai
      - run: ./scripts/gen-ai-client.sh
      - name: 재생성 결과가 커밋과 같은지 확인
        run: git diff --exit-code -- ai/openapi.json backend/src/LexWatch.Api/Ai/AiClient.g.cs

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next typegen   # PageProps/LayoutProps 전역 타입은 .next/types에 생성된다
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t lexwatch-api:ci .
      - run: docker build -f ai/Dockerfile -t lexwatch-ai:ci .
      - run: docker build -f web/Dockerfile -t lexwatch-web:ci .

  deploy-api:
    # main에 push되고 위 다섯 잡이 모두 통과했을 때만 Render API를 배포한다.
    # Vercel(web, ai)은 Git 연동으로 따로 배포된다. 절차와 시크릿: docs/deploy.md "자동 배포"
    needs: [backend, ai, openapi-drift, web, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    steps:
      - name: Render 배포 요청
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL 시크릿이 없다. docs/deploy.md '자동 배포' 절을 보고 넣는다."
            exit 1
          fi
          # 훅 URL은 비밀이라 로그에 남기지 않는다. ref로 이 커밋을 배포하게 한다.
          curl --silent --show-error --fail --max-time 30 -X POST "${HOOK}&ref=${GITHUB_SHA}" -o /dev/null
          echo "배포 요청: ${GITHUB_SHA}"
      - name: 새 커밋이 뜰 때까지 기다림
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          # 빌드와 기동, 무료 플랜 깨우기까지 최대 20분. /health의 commit이 이 커밋이 되면 끝.
          for i in $(seq 1 80); do
            got=$(curl --silent --max-time 30 "${API_BASE_URL}/health" | jq -r '.commit // empty' 2>/dev/null || true)
            if [ "$got" = "$GITHUB_SHA" ]; then echo "live: $got"; exit 0; fi
            echo "대기 ${i}/80 (현재 ${got:-응답 없음})"
            sleep 15
          done
          echo "::error::20분 안에 ${GITHUB_SHA}가 뜨지 않았다. Render 대시보드의 배포 로그를 본다."
          exit 1
