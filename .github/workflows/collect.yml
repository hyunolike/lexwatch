name: collect

on:
  schedule:
    - cron: "0 22 * * *"   # UTC 22:00 = KST 07:00 (GitHub 예약 실행은 몇 시간 늦게 시작되기도 한다)
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    # 깨우기(API 3분, AI 3분) + 수집(재시도 포함 약 6분) + 감시 15분 (collect-health CH-05)
    timeout-minutes: 30
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
    steps:
      - name: 서버 깨우기 (무료 플랜은 잠들어 있고 첫 요청이 1분쯤 실패할 수 있다)
        run: |
          curl --silent --show-error --fail --max-time 30 \
            --retry 12 --retry-delay 15 --retry-all-errors \
            "$API_BASE_URL/health"

      - name: AI 서비스 깨우기 (끝내 응답이 없어도 수집은 진행한다. 실패는 감시 단계가 알린다)
        run: |
          for i in $(seq 1 12); do
            if curl --silent --show-error --fail --max-time 20 -X POST \
                 -H "X-Job-Token: $JOB_TOKEN" "$API_BASE_URL/jobs/wake-ai"; then
              echo; echo "AI 서비스 응답 ($i번째 시도)"; exit 0
            fi
            echo; echo "AI 서비스 대기 중 ($i/12)"; sleep 15
          done
          echo "::warning::AI 서비스가 3분 안에 깨어나지 않았다"

      - name: 수집 호출
        run: |
          curl --silent --show-error --fail --max-time 300 -X POST \
            --retry 3 --retry-delay 20 --retry-all-errors \
            -H "X-Job-Token: $JOB_TOKEN" \
            "$API_BASE_URL/jobs/collect" | tee collect.json
          echo
          jq -r '.runIds[]' collect.json > run_ids.txt
          echo "이번 수집이 만든 실행: $(wc -l < run_ids.txt)건"

      - name: 실행이 끝날 때까지 감시하고 실패를 잡 실패로 올린다 (최대 15분)
        run: |
          # 분류가 끝나면 실행 상태는 바로 InReview가 되지만 그룹 분석과 크리틱은 그 뒤에 돈다.
          # 그래서 실행 상태만 보지 않고 남은 단계와 Analyzing 그룹까지 본다(collect-health CH-04).
          detail_of() {
            curl --silent --fail --max-time 30 --retry 2 --retry-delay 5 \
              -H "X-Demo-Role: admin" "$API_BASE_URL/api/runs/$1" || echo '{}'
          }
          # 끝나지 않은 일의 수. 조회 실패(빈 응답)는 끝나지 않은 것으로 센다.
          PENDING='if .run == null then 1 else
            ([.run.status] | map(select(. == "Queued" or . == "Running")) | length)
            + ([.timeline[] | select(.kind == "step" and (.status == "Pending" or .status == "Running" or .status == "RetryScheduled"))] | length)
            + ([.groups[] | select(.status == "Analyzing")] | length) end'
          # (단계, 그룹)마다 마지막 시도가 Failed인 단계. 재실행으로 회복한 단계는 빠진다.
          FAILED='[.timeline[] | select(.kind == "step")] | group_by([.step, (.groupCode // "")]) | map(last)
            | map(select(.status == "Failed"))'

          if [ ! -s run_ids.txt ]; then echo "새 실행이 없다"; exit 0; fi
          for i in $(seq 1 15); do
            pending=0
            while read -r id; do
              n=$(detail_of "$id" | jq "$PENDING" 2>/dev/null || echo 1)
              pending=$((pending + n))
            done < run_ids.txt
            echo "$i분: 남은 일 $pending건"
            [ "$pending" -eq 0 ] && break
            # 처리하는 동안 API와 AI가 잠들지 않게 한다
            curl --silent --max-time 20 -X POST -H "X-Job-Token: $JOB_TOKEN" "$API_BASE_URL/jobs/wake-ai" > /dev/null || true
            sleep 60
          done

          bad=0
          while read -r id; do
            detail=$(detail_of "$id")
            name=$(echo "$detail" | jq -r '.lawChange.lawName // "?"')
            groups=$(echo "$detail" | jq -r '[.groups[]? | select(.status != "ClosedIrrelevant") | "\(.groupCode)=\(.status)"] | join(", ")')
            echo "$(echo "$detail" | jq -r '.run.status // "Unknown"')  $name  [$groups]  ($id)"
            failed=$(echo "$detail" | jq -r "$FAILED"' | .[] | "  실패 단계: \(.step) \(.groupCode // "") 시도 \(.attempt) \(.errorCode // "") \(.errorMessage // "")"' 2>/dev/null)
            if [ -n "$failed" ] || [ "$(echo "$detail" | jq -r '.run.status // "Unknown"')" = "Failed" ]; then
              bad=1
              [ -n "$failed" ] && echo "$failed"
              echo "::error::실패한 단계가 있다: $name ($id)"
            elif [ "$(echo "$detail" | jq "$PENDING" 2>/dev/null || echo 1)" != "0" ]; then
              bad=1
              echo "::error::15분 안에 끝나지 않음: $name ($id)"
            fi
          done < run_ids.txt
          exit $bad

  bills:
    # 공포 전 법안 레이더(bill-radar BR-09). 법령 수집과 따로 돌아 서로의 실패에 영향을 주지 않는다.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
    steps:
      - name: 서버 깨우기
        run: |
          curl --silent --show-error --fail --max-time 30 \
            --retry 12 --retry-delay 15 --retry-all-errors \
            "$API_BASE_URL/health"

      - name: 국회 법안 수집 (서버가 120초 안에 끝낸다. 502와 시간 초과는 다시 시도하지 않는다)
        run: |
          code=$(curl --silent --show-error --max-time 200 -o bills.json -w "%{http_code}" -X POST \
            -H "X-Job-Token: $JOB_TOKEN" "$API_BASE_URL/jobs/collect-bills")
          cat bills.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::법안 수집 실패 (HTTP $code)"
            exit 1
          fi
          n=$(jq '.failures | length' bills.json)
          if [ "$n" -gt 0 ]; then
            echo "::warning::법안 수집 중 $n건 실패: $(jq -c '[.failures[] | "\(.target) \(.code)"] | .[:10]' bills.json)"
          fi
