# 웹(Next.js) 배포. Vercel 팀이 공정 사용 한도로 멈춰 2026-11-21 Netlify로 옮겼다(docs/deploy.md).
# web 폴더에서 실행한다(netlify deploy --build --prod). 배포는 CI(deploy-web)가 테스트 통과 뒤 CLI로 한다. 저장소 연결 자동 배포는 쓰지 않는다.
[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_API_BASE_URL = "https://lexwatch-api-qinh.onrender.com"
