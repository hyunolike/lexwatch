[project]
name = "lexwatch-ai"
version = "0.1.0"
description = "LexWatch stateless AI service (FastAPI)"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "pydantic>=2.8", "httpx>=0.27", "uvicorn>=0.30"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
# Optional, NOT in the deployed bundle (~150MB extra: fastembed/onnxruntime). See ai/README.md.
guardrails = ["nemoguardrails>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.uv]
package = false
